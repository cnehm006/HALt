name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev clang-format clang-tidy
      - name: Linux build and test
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Linux quality
        if: runner.os == 'Linux'
        run: |
          python scripts/check_quality.py
          cmake -S . -B build-tidy -DHALT_TIDY=ON
          cmake --build build-tidy --parallel 2
      - name: Windows configure with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Web API and validation runner integration
        run: python -m pytest tests/web -v --junitxml=reports/web-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: reports/
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang cmake libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - run: python -m pip install -r requirements-dev.txt
      - name: Sanitized build and system tests
        env:
          CC: clang
          CXX: clang++
          HALT_BUILD_DIR: build-asan
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          bash scripts/build.sh -DHALT_SANITIZERS=ON
          bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizers
          path: reports/
