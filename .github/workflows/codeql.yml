name: CodeQL
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp,python
          build-mode: manual
      - run: bash scripts/build.sh
      - uses: github/codeql-action/analyze@v4
